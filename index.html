
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>計算パターン帳</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-body">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">

    <div class="sidebar-brand">
      <div class="brand-mark">∫</div>
      <div class="brand-text">
        <span class="brand-name">計算パターン帳</span>
        <span class="brand-sub">Formula Calculator</span>
      </div>
    </div>

    <div class="sidebar-section-header">
      <span class="section-label">Patterns</span>
      <button class="btn-icon" id="btn-new-top" title="新規追加">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <ul id="pattern-list"></ul>

    <div class="sidebar-footer">
      <button class="btn-add" id="btn-new-bottom">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <path d="M6.5 1v11M1 6.5h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        新しいパターン
      </button>
    </div>

  </aside>

  <!-- ── Main ── -->
  <main class="detail" id="detail">

    <!-- Empty state -->
    <div class="empty-msg" id="empty-msg" hidden>
      <div class="empty-glyph">f(x)</div>
    </div>
    <!-- ── Calc panel ── -->
    <div id="calc-panel" hidden>

      <div class="panel-header">
        <h2 id="cp-title"></h2>
        <div class="panel-actions">
          <button class="btn btn-ghost btn-sm" id="btn-history">履歴・統計</button>
          <button class="btn btn-ghost btn-sm" id="btn-edit">編集</button>
          <button class="btn btn-danger-ghost btn-sm" id="btn-delete">削除</button>
        </div>
      </div>

      <div class="formula-block">
        <div class="block-label">Formula</div>
        <code id="cp-formula"></code>
      </div>

      <div class="vars-grid" id="cp-vars"></div>

      <div class="result-block">
        <div class="result-tag">Result</div>
        <div class="result-number" id="cp-result">—</div>
        <button class="btn-record" id="btn-record" disabled>記録する</button>
      </div>

    </div>

    <!-- ── Edit panel ── -->
    <div id="edit-panel" hidden>

      <div class="panel-header">
        <h2 id="edit-title">新しいパターン</h2>
      </div>

      <div class="form-field">
        <label for="ep-name">パターン名</label>
        <input type="text" id="ep-name" placeholder="例: 消費税込み価格" autocomplete="off">
      </div>

      <div class="form-field">
        <label for="ep-formula">数式</label>
        <textarea id="ep-formula" rows="3"
          placeholder="例: 税抜価格 * (1 + 税率 / 100)&#10;変数名は日本語・英字どちらもOK"></textarea>
        <div class="vars-preview" id="ep-vars-preview"></div>
        <div class="error" id="ep-error" hidden></div>
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" id="btn-save">保存する</button>
        <button class="btn btn-ghost" id="btn-cancel">キャンセル</button>
      </div>

      <div class="help-block">
        <div class="help-label">数式の書き方</div>
        <div class="help-rows">
          <div class="help-row">
            <code>税率</code><code>price</code>
            <span>日本語・英字どちらも変数名に使えます</span>
          </div>
          <div class="help-row">
            <code>+</code><code>-</code><code>*</code><code>/</code><code>( )</code>
            <span>四則演算と括弧</span>
          </div>
          <div class="help-row">
            <code>単価 * 数量 * (1 - 割引率/100)</code>
          </div>
        </div>
      </div>

    </div>

    <!-- ── History / Stats panel ── -->
    <div id="history-panel" hidden>

      <div class="panel-header">
        <div class="hp-title-group">
          <button class="btn-back" id="btn-back-to-calc">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            計算に戻る
          </button>
          <h2 id="hp-title"></h2>
        </div>
        <button class="btn btn-danger-ghost btn-sm" id="btn-clear-hist">履歴をクリア</button>
      </div>

      <!-- Stats grid -->
      <div class="stats-grid" id="hp-stats"></div>

      <!-- Chart -->
      <div class="chart-block" id="hp-chart"></div>

      <!-- Table -->
      <div class="history-table-wrap">
        <table class="history-table" id="hp-table"></table>
      </div>

    </div>

  </main>
</div>

<script type="module" src="app.js"></script>
<script>
  // Result pulse on value change
  const r = document.getElementById('cp-result');
  if (r) {
    new MutationObserver(() => {
      r.classList.remove('pulse');
      void r.offsetWidth;
      r.classList.add('pulse');
    }).observe(r, { childList: true, characterData: true, subtree: true });
  }
</script>
</body>
</html>
